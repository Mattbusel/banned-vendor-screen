[package]
name = "banned-vendor-screen"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Federal research money already pays vendors the US has banned. Screen payment lines, subawards or award text against DoD 1260H, Section 889, FCC Covered List, UFLPA and BIOSECURE, with owners, subsidiaries and product names, and fail the build on a hit."
license = "MIT"
repository = "https://github.com/Mattbusel/banned-vendor-screen"
readme = "README.md"
keywords = ["sanctions", "compliance", "procurement", "section-889", "biosecure"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/fixtures/*.csv", "examples/*"]

[[bin]]
name = "banned-vendor-screen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
csv = "1.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
