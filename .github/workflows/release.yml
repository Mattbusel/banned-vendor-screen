name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd target/release
          if [ -f banned-vendor-screen.exe ]; then b=banned-vendor-screen.exe; else b=banned-vendor-screen; fi
          tar -czf "../../banned-vendor-screen-$TARGET.tar.gz" "$b"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md" || true
          gh release upload "$TAG" "banned-vendor-screen-$TARGET.tar.gz" --clobber
